name = "sms-iyts"
main = "index.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[ratelimits]]
name = "SMS_RATE_LIMITER"
namespace_id = "48132001"

  [ratelimits.simple]
  limit = 1
  period = 60

[observability]
enabled = true

  [observability.logs]
  enabled = true
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  head_sampling_rate = 0.01
