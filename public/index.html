<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>SMS-IYTS 短信測試系統</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      --bg: #06101d;
      --panel: #0d1b2d;
      --line: #294560;
      --text: #ecf5ff;
      --muted: #9db0c5;
      --accent: #35d39a;
      --accent-dark: #071b16;
      --danger: #ff6b7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(circle at 15% 10%, #12335a 0, transparent 34%),
        radial-gradient(circle at 90% 80%, #0e3c33 0, transparent 32%),
        var(--bg);
      color: var(--text);
    }
    main {
      width: min(620px, 100%);
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #0d1b2df2;
      box-shadow: 0 30px 80px #0009;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); line-height: 1.1; }
    .intro { margin: 16px 0 28px; color: var(--muted); line-height: 1.7; }
    form { display: grid; gap: 18px; }
    label { display: grid; gap: 8px; font-weight: 700; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      background: #071320;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #35d39a22; }
    textarea { min-height: 112px; resize: vertical; }
    .counter { justify-self: end; margin-top: -4px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .consent { grid-template-columns: 20px 1fr; align-items: start; gap: 10px; color: var(--muted); font-weight: 500; line-height: 1.5; }
    .consent input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: var(--accent);
      color: var(--accent-dark);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform .16s ease, opacity .16s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .62; transform: none; }
    #status {
      display: none;
      margin-top: 20px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #071320;
      line-height: 1.5;
    }
    #status.show { display: block; }
    #status.success { border-color: #35d39a66; color: #7ef0c6; }
    #status.error { border-color: #ff6b7a66; color: var(--danger); }
    footer { margin-top: 24px; color: #6f859d; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">SMS-IYTS</p>
    <h1>短信測試系統</h1>
    <p class="intro">用於內部短信通道與送達測試。請輸入本次測試範圍內的手機號碼，每個號碼每分鐘最多測試一次。</p>

    <form id="send-form">
      <label>
        測試手機號碼
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="例如：+8613812345678" required>
      </label>

      <label>
        測試短信內容
        <textarea id="message" name="message" maxlength="140" placeholder="請輸入本次測試內容" required></textarea>
        <span class="counter"><span id="count">0</span>/140</span>
      </label>

      <label class="consent">
        <input id="consent" name="consent" type="checkbox" required>
        <span>我確認此號碼屬於本次內部測試範圍，並已取得接收測試短信的同意。</span>
      </label>

      <button id="submit" type="submit">開始測試</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <footer>測試請求由本站 Worker 後端處理；供應商憑證不會傳送到瀏覽器。</footer>
  </main>

  <script>
    const form = document.getElementById('send-form');
    const message = document.getElementById('message');
    const count = document.getElementById('count');
    const submit = document.getElementById('submit');
    const statusBox = document.getElementById('status');

    message.addEventListener('input', () => {
      count.textContent = String(message.value.length);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      submit.textContent = '正在測試…';
      showStatus('正在向短信測試服務提交請求…', '');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const response = await fetch('/api/send', {
          method: 'POST',
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: document.getElementById('phone').value.trim(),
            message: message.value.trim(),
            consent: document.getElementById('consent').checked,
          }),
        });

        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(errorMessage(body.error, response.status));

        showStatus(`測試請求已接受。請求編號：${body.requestId}`, 'success');
        form.reset();
        count.textContent = '0';
      } catch (error) {
        const text = error.name === 'AbortError' ? '請求超時，請稍後重試。' : error.message;
        showStatus(text || '提交失敗，請稍後重試。', 'error');
      } finally {
        clearTimeout(timeoutId);
        submit.disabled = false;
        submit.textContent = '開始測試';
      }
    });

    function showStatus(text, kind) {
      statusBox.textContent = text;
      statusBox.className = `show ${kind}`.trim();
    }

    function errorMessage(code, status) {
      const messages = {
        consent_required: '請先確認接收者同意接收本次短信。',
        invalid_phone: '手機號碼格式不正確。',
        invalid_message: '短信內容須為 1 至 140 個字元。',
        rate_limited: '此號碼一分鐘內已提交過，請稍後再試。',
        provider_not_configured: '短信供應商尚未完成配置，請聯絡管理員。',
        provider_rejected: '短信供應商未接受本次請求。',
        provider_timeout: '短信供應商回應超時。',
        provider_unavailable: '短信供應商暫時不可用。',
      };
      return messages[code] || `提交失敗（HTTP ${status}）。`;
    }
  </script>
</body>
</html>
